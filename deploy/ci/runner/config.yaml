log:
  level: info

runner:
  file: /data/.runner
  capacity: 1          # 串行执行，防止挤占本机开发与 OpenSandbox
  timeout: 40m
  insecure: false
  fetch_timeout: 5s
  fetch_interval: 2s
  labels:
    - "docker-linux:docker://docker.m.daocloud.io/library/node:24-bookworm"
    - "ubuntu-latest:docker://docker.m.daocloud.io/library/node:24-bookworm"

host:
  workdir_parent: workspace

container:
  privileged: false
  network: qiyu-ci_default   # job 容器与 Gitea 同网络，克隆走内网别名
  valid_volumes:
    - /workspace
