log:
  level: info

runner:
  file: /data/.runner
  capacity: 1          # 串行执行，防止挤占本机开发与 OpenSandbox
  timeout: 40m
  insecure: false
  fetch_timeout: 5s
  fetch_interval: 2s
  labels:
    - "docker-linux:docker://docker.1ms.run/node:24-bookworm"
    - "ubuntu-latest:docker://docker.1ms.run/node:24-bookworm"

host:
  workdir_parent: workspace

container:
  privileged: false
  valid_volumes:
    - /workspace
