<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Live2D 测试页面</title>
  <script src="/lib/live2dcubismcore.min.js"></script>
  <style>
    body { margin: 0; padding: 0; background: #1a1a2e; color: #eee; font-family: sans-serif; }
    #container { width: 100vw; height: 100vh; position: relative; }
    #canvas-container { width: 100%; height: 100%; }
    #status { position: absolute; top: 10px; left: 10px; padding: 8px 16px; border-radius: 8px; background: rgba(0,0,0,0.7); font-size: 14px; z-index: 10; }
    #logs { position: absolute; bottom: 10px; left: 10px; right: 10px; max-height: 200px; overflow-y: auto; padding: 8px; border-radius: 8px; background: rgba(0,0,0,0.7); font-size: 12px; font-family: monospace; z-index: 10; }
    .log-error { color: #ff6b6b; }
    .log-success { color: #51cf66; }
    .log-info { color: #74c0fc; }
  </style>
</head>
<body>
  <div id="container">
    <div id="status">准备中...</div>
    <div id="canvas-container"></div>
    <div id="logs"></div>
  </div>

  <script type="module">
    const statusEl = document.getElementById('status')
    const logsEl = document.getElementById('logs')
    const container = document.getElementById('canvas-container')

    function log(msg, type = 'info') {
      const div = document.createElement('div')
      div.className = `log-${type}`
      div.textContent = `[${new Date().toLocaleTimeString()}] ${msg}`
      logsEl.appendChild(div)
      logsEl.scrollTop = logsEl.scrollHeight
      console.log(`[Live2D Test] ${msg}`)
    }

    log('测试页面启动')
    log(`Cubism Core: ${typeof window.Live2DCubismCore !== 'undefined' ? '已加载' : '未加载'}`, 
        typeof window.Live2DCubismCore !== 'undefined' ? 'success' : 'error')

    try {
      // 导入 pixi.js（使用 Vite 的 /@id/ 前缀解析裸模块）
      log('正在导入 pixi.js...')
      const PIXI = await import('/@id/pixi.js')
      log('pixi.js 导入成功', 'success')

      // 关键：在导入 pixi-live2d-display 之前设置 window.PIXI
      window.PIXI = PIXI
      log('window.PIXI 已设置')

      // 导入 pixi-live2d-display
      log('正在导入 pixi-live2d-display/cubism4...')
      const { Live2DModel } = await import('/@id/pixi-live2d-display/cubism4')
      log('pixi-live2d-display 导入成功', 'success')

      // 创建 PixiJS Application
      const width = container.clientWidth
      const height = container.clientHeight
      log(`容器尺寸: ${width}x${height}`)

      const app = new PIXI.Application({
        width,
        height,
        backgroundAlpha: 0,
        autoDensity: true,
        resolution: window.devicePixelRatio || 1,
        antialias: true,
      })
      
      const canvas = app.view
      canvas.style.width = '100%'
      canvas.style.height = '100%'
      container.appendChild(canvas)
      log('PixiJS Application 创建成功')

      // 加载模型
      const modelPath = '/models/006/006rikai.model3.json'
      log(`正在加载模型: ${modelPath}`)
      statusEl.textContent = '模型加载中...'

      const model = await Live2DModel.from(modelPath)
      log(`模型加载成功! 尺寸: ${model.width}x${model.height}`, 'success')

      // 计算缩放
      const scale = Math.min(
        (width * 0.85) / model.width,
        (height * 0.85) / model.height
      )
      model.scale.set(scale)
      model.x = (width - model.width) / 2
      model.y = (height - model.height) / 2 - (height * 0.05)

      app.stage.addChild(model)
      log('模型已添加到舞台', 'success')
      statusEl.textContent = '模型加载成功!'
      statusEl.style.background = 'rgba(81, 207, 102, 0.8)'

      // 鼠标跟随
      container.addEventListener('mousemove', (e) => {
        const rect = container.getBoundingClientRect()
        model.focus(e.clientX - rect.left, e.clientY - rect.top)
      })
      container.addEventListener('mouseleave', () => {
        model.focus(width / 2, height / 2)
      })
      log('鼠标交互已启用')

      // 尝试播放 Idle 动画
      try {
        model.motion('Idle')
        log('Idle 动画已播放')
      } catch {
        log('无 Idle 动画（可忽略）')
      }

      log('=== 测试完成 ===', 'success')

    } catch (err) {
      log(`错误: ${err.message}`, 'error')
      log(`堆栈: ${err.stack || '无'}`, 'error')
      statusEl.textContent = '加载失败: ' + err.message
      statusEl.style.background = 'rgba(255, 107, 107, 0.8)'
    }
  </script>
</body>
</html>
