<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128" fill="none">
  <!-- Background circle -->
  <circle cx="64" cy="64" r="60" fill="#0ea5e9" opacity="0.15"/>
  <circle cx="64" cy="64" r="60" stroke="#0ea5e9" stroke-width="2" fill="none" opacity="0.4"/>

  <!-- Robot head -->
  <rect x="38" y="28" width="52" height="44" rx="12" fill="#38bdf8" opacity="0.9"/>

  <!-- Eyes -->
  <circle cx="52" cy="48" r="5" fill="white"/>
  <circle cx="76" cy="48" r="5" fill="white"/>
  <circle cx="53" cy="47" r="2.5" fill="#0c4a6e"/>
  <circle cx="77" cy="47" r="2.5" fill="#0c4a6e"/>

  <!-- Mouth (smile) -->
  <path d="M52 60 Q64 70 76 60" stroke="white" stroke-width="2.5" fill="none" stroke-linecap="round"/>

  <!-- Antenna -->
  <line x1="64" y1="28" x2="64" y2="16" stroke="#0ea5e9" stroke-width="2.5" stroke-linecap="round"/>
  <circle cx="64" cy="13" r="4" fill="#0ea5e9"/>

  <!-- Body -->
  <rect x="44" y="74" width="40" height="28" rx="8" fill="#38bdf8" opacity="0.7"/>

  <!-- Arms -->
  <line x1="44" y1="82" x2="32" y2="92" stroke="#0ea5e9" stroke-width="3" stroke-linecap="round"/>
  <line x1="84" y1="82" x2="96" y2="92" stroke="#0ea5e9" stroke-width="3" stroke-linecap="round"/>

  <!-- Sparkle decorations -->
  <circle cx="24" cy="36" r="2" fill="#fbbf24" opacity="0.8"/>
  <circle cx="104" cy="40" r="2" fill="#fbbf24" opacity="0.8"/>
  <circle cx="28" cy="88" r="1.5" fill="#fbbf24" opacity="0.6"/>
  <circle cx="100" cy="84" r="1.5" fill="#fbbf24" opacity="0.6"/>
</svg>
