name: client
on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'electron/**'
      - 'public/**'
      - 'index.html'
      - 'vite.config.ts'
      - 'package.json'
      - '.gitea/workflows/client.yml'
  pull_request:
    paths:
      - 'src/**'
      - 'electron/**'
      - 'public/**'
      - 'index.html'
      - 'vite.config.ts'
      - 'package.json'
      - '.gitea/workflows/client.yml'

jobs:
  linux:
    name: linux 容器 · lint + 类型 + 前端构建
    runs-on: docker-linux
    steps:
      - name: 检出代码
        uses: https://gitea.com/actions/checkout@v4
      - name: 安装依赖（npm ci，平台独立安装）
        run: npm ci --no-audit --no-fund
      - name: ESLint
        run: npx eslint . --ext ts,tsx --max-warnings 0
      - name: 跨平台纪律（禁止硬编码盘符路径）
        run: |
          if grep -rEn '"[A-Za-z]:\\' src electron --include='*.ts' --include='*.tsx'; then
            echo '::error::发现硬编码盘符路径，请改用 path.join 或相对路径'
            exit 1
          fi
      - name: TypeScript 类型检查
        run: npx tsc --noEmit
      - name: Vite 生产构建
        run: npx vite build

  windows:
    name: windows 原生 · 类型 + 前端构建 + Electron 打包链路
    runs-on: windows-native
    steps:
      - name: 检出代码
        uses: https://gitea.com/actions/checkout@v4
      - name: Node 版本（要求主版本 24）
        run: node -v
      - name: 安装依赖（npm ci，平台独立安装）
        run: npm ci --no-audit --no-fund
      - name: TypeScript 类型检查
        run: npx tsc --noEmit
      - name: Vite 生产构建
        run: npx vite build
      - name: Electron 打包（--dir 验证打包链路，NSIS 完整安装包走 tag 流水线）
        run: npx electron-builder --dir
        env:
          ELECTRON_MIRROR: https://npmmirror.com/mirrors/electron/
          ELECTRON_BUILDER_BINARIES_MIRROR: https://npmmirror.com/mirrors/electron-builder-binaries/
